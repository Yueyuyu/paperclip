name: Fork - sync upstream

on:
  schedule:
    # 05:17 Asia/Shanghai. GitHub may delay scheduled jobs.
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Yueyuyu/paperclip'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 验证同步边界
        run: node --test scripts/fork-sync.test.mjs
      - name: 检测更新，有专用凭据时同步镜像
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
          FORK_SYNC_CREDENTIAL_CONFIGURED: ${{ secrets.FORK_SYNC_TOKEN != '' }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/fork-sync.mjs
      - name: 保存明确的同步状态
        uses: actions/upload-artifact@v4
        with:
          name: fork-sync-status
          path: fork-sync-status.json
          retention-days: 7
          if-no-files-found: error
