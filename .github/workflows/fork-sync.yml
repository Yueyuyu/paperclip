name: Fork - sync upstream

on:
  schedule:
    # 05:17 Asia/Shanghai. GitHub may delay scheduled jobs.
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: fork-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Yueyuyu/paperclip'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Update mirror and open a review request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/fork-sync.mjs
